<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>

<meta charset="UTF-8"/>

<title>Modern Resume</title>

<style>

@page{
    size:A4;
    margin:10mm;
}

body{
    font-family:Arial,sans-serif;
    color:#333;
    font-size:14px;
    line-height:1.6;
    margin:0;
}

.header{
    text-align:center;
    border-bottom:2px solid #1565C0;
    padding-bottom:6px;
    margin-bottom:8px;
}

h1{
    color:#1565C0;
    margin:0;
    font-size:30px;
}

.info{
    color:#555;
    margin-top:4px;
    font-size:14px;
}

.section{
    margin-top:10px;
}

.section h2{
    color:#1565C0;
    border-bottom:2px solid #1565C0;
    padding-bottom:5px;
    margin:0 0 8px 0;
    font-size:18px;
}

p,
div{
    margin:4px 0;
    line-height:1.5;
    white-space:normal;
    word-wrap:break-word;
}

ul{
    margin:4px 0 4px 20px;
    padding:0;
}

li{
    margin:3px 0;
}

</style>

</head>

<body>

<div class="header">
    <h1>${name}</h1>

    <div class="info">
        ${email} | ${phone}
    </div>
</div>

<div class="section">
    <h2>Professional Summary</h2>
    <p>${summary}</p>
</div>

<div class="section">
    <h2>Skills</h2>
    <div>${skills}</div>
</div>

<div class="section">
    <h2>Experience</h2>
    <div>${experience}</div>
</div>

<div class="section">
    <h2>Projects</h2>
    <div>${projects}</div>
</div>

<div class="section">
    <h2>Education</h2>
    <div>${education}</div>
</div>

<div class="section">
    <h2>Certifications</h2>
    <div>${certifications}</div>
</div>

<div class="section">
    <h2>Achievements</h2>
    <div>${achievements}</div>
</div>

<div class="section" style="margin-top:8px;">
    <h2>Languages</h2>
    <div>${languages}</div>
</div>

</body>

</html>
