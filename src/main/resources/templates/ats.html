<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>

<meta charset="UTF-8"/>

<title>ATS Resume</title>

<style>

@page{
    size:A4;
    margin:10mm;
}

body{
    font-family:Arial,sans-serif;
    font-size:12px;
    color:#222;
    line-height:1.5;
    margin:0;
}

.header{
    text-align:center;
    border-bottom:3px solid #1E3A5F;
    padding-bottom:8px;
    margin-bottom:10px;
}

.name{
    font-size:26px;
    font-weight:bold;
    color:#1E3A5F;
}

.contact{
    color:#666;
    font-size:12px;
    margin-top:4px;
}

.section{
    margin-top:10px;
}

.section-title{
    background:#1E3A5F;
    color:white;
    padding:6px 8px;
    font-size:14px;
    font-weight:bold;
}

.content{
    border:1px solid #ccc;
    padding:8px;
    line-height:1.5;
    white-space:normal;
    word-wrap:break-word;
}

.content p,
.content div{
    margin:4px 0;
}

.content ul{
    margin:4px 0 4px 20px;
    padding:0;
}

.content li{
    margin:3px 0;
}

</style>

</head>

<body>

<div class="header">

<div class="name">${name}</div>

<div class="contact">
${email} | ${phone}
</div>

</div>

<div class="section">
<div class="section-title">Professional Summary</div>
<div class="content">
<p>${summary}</p>
</div>
</div>

<div class="section">
<div class="section-title">Skills</div>
<div class="content">
${skills}
</div>
</div>

<div class="section">
<div class="section-title">Experience</div>
<div class="content">
${experience}
</div>
</div>

<div class="section">
<div class="section-title">Projects</div>
<div class="content">
${projects}
</div>
</div>

<div class="section">
<div class="section-title">Education</div>
<div class="content">
${education}
</div>
</div>

<div class="section">
<div class="section-title">Certifications</div>
<div class="content">
${certifications}
</div>
</div>

<div class="section">
<div class="section-title">Achievements</div>
<div class="content">
${achievements}
</div>
</div>

<div class="section">
<div class="section-title">Languages</div>
<div class="content">
${languages}
</div>
</div>

</body>

</html>
