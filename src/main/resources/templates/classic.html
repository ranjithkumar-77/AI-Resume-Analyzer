<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>

<meta charset="UTF-8"/>

<title>Classic Resume</title>

<style>

@page{
    size:A4;
    margin:10mm;
}

body{
    font-family:"Times New Roman",serif;
    color:#000;
    font-size:14px;
    line-height:1.5;
    margin:0;
}

.container{
    border:2px solid #000;
    padding:18px;
}

h1{
    text-align:center;
    margin:0;
    font-size:30px;
}

.contact{
    text-align:center;
    margin-top:5px;
    margin-bottom:15px;
    font-size:14px;
}

.section{
    margin-top:12px;
}

.section h2{
    margin:0 0 6px 0;
    padding-bottom:3px;
    border-bottom:1px solid #000;
    font-size:18px;
}

p,
div{
    margin:4px 0;
    white-space:normal;
    line-height:1.5;
    text-align:justify;
    word-wrap:break-word;
}

ul{
    margin:4px 0 4px 20px;
    padding:0;
}

li{
    margin:3px 0;
}

</style>

</head>

<body>

<div class="container">

<h1>${name}</h1>

<div class="contact">
${email} | ${phone}
</div>

<div class="section">
<h2>Career Objective</h2>
<p>${summary}</p>
</div>

<div class="section">
<h2>Skills</h2>
<div>${skills}</div>
</div>

<div class="section">
<h2>Experience</h2>
<div>${experience}</div>
</div>

<div class="section">
<h2>Projects</h2>
<div>${projects}</div>
</div>

<div class="section">
<h2>Education</h2>
<div>${education}</div>
</div>

<div class="section">
<h2>Certifications</h2>
<div>${certifications}</div>
</div>

<div class="section">
<h2>Achievements</h2>
<div>${achievements}</div>
</div>

<div class="section" style="margin-top:8px;">
<h2>Languages</h2>
<div>${languages}</div>
</div>

</div>

</body>

</html>
