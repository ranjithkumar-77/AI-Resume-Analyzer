<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Job Descriptions</title>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            margin:40px;
        }

        .container{
            width:900px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        h1{
            text-align:center;
            color:#1565C0;
        }

        input,
        textarea{
            width:100%;
            padding:10px;
            margin-top:8px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        textarea{
            height:150px;
            resize:vertical;
        }

        button{
            background:#1565C0;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0D47A1;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:30px;
        }

        table,
        th,
        td{
            border:1px solid #ddd;
        }

        th{
            background:#1565C0;
            color:white;
        }

        th,
        td{
            padding:10px;
            text-align:left;
            vertical-align:top;
        }

        a{
            color:red;
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Job Description Management</h1>

    <form th:action="@{/jobs/save}" method="post" th:object="${job}">

        <label>Job Title</label>

        <input
                type="text"
                th:field="*{title}"
                placeholder="Enter Job Title"
                required>

        <label>Job Description</label>

        <textarea
                th:field="*{description}"
                placeholder="Enter Job Description"
                required></textarea>

        <button type="submit">
            Save Job
        </button>

    </form>

    <table>

        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Action</th>
        </tr>

        <tr th:each="job : ${jobs}">

            <td th:text="${job.id}"></td>

            <td th:text="${job.title}"></td>

            <td style="white-space:pre-wrap"
                th:text="${job.description}">
            </td>

            <td>
                <a th:href="@{/jobs/delete/{id}(id=${job.id})}">
                    Delete
                </a>
            </td>

        </tr>

    </table>

</div>

</body>

</html>
