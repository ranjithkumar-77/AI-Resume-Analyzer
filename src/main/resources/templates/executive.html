<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>

<meta charset="UTF-8"/>

<title>Executive Resume</title>

<style>

@page{
    size:A4;
    margin:10mm;
}

body{
    font-family:Calibri,Arial,sans-serif;
    margin:0;
    color:#2c3e50;
    font-size:13px;
    line-height:1.5;
}

.header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:12px;
    margin-bottom:10px;
}

.header h1{
    margin:0;
    font-size:28px;
}

.header p{
    margin:4px 0 0;
    font-size:13px;
}

.section{
    margin-top:10px;
}

.section-title{
    background:#34495e;
    color:white;
    padding:6px 8px;
    font-size:15px;
    font-weight:bold;
}

.content{
    border:1px solid #dcdcdc;
    padding:8px;
    line-height:1.5;
    white-space:normal;
    word-wrap:break-word;
}

.content p,
.content div{
    margin:4px 0;
}

.content ul{
    margin:4px 0 4px 20px;
    padding:0;
}

.content li{
    margin:3px 0;
}

</style>

</head>

<body>

<div class="header">

<h1>${name}</h1>

<p>
${email} | ${phone}
</p>

</div>

<div class="section">
<div class="section-title">Professional Summary</div>
<div class="content">
<p>${summary}</p>
</div>
</div>

<div class="section">
<div class="section-title">Skills</div>
<div class="content">
${skills}
</div>
</div>

<div class="section">
<div class="section-title">Experience</div>
<div class="content">
${experience}
</div>
</div>

<div class="section">
<div class="section-title">Projects</div>
<div class="content">
${projects}
</div>
</div>

<div class="section">
<div class="section-title">Education</div>
<div class="content">
${education}
</div>
</div>

<div class="section">
<div class="section-title">Certifications</div>
<div class="content">
${certifications}
</div>
</div>

<div class="section">
<div class="section-title">Achievements</div>
<div class="content">
${achievements}
</div>
</div>

<div class="section">
<div class="section-title">Languages</div>
<div class="content">
${languages}
</div>
</div>

</body>

</html>
