<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AI Resume Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav-bar">
    <div class="nav-brand">
        <span class="brand-title">AI Resume Analyzer</span>
        <span class="brand-tag">Create your account and get started</span>
    </div>
    <div class="nav-actions">
        <a href="index.html" class="button button-outline">Home</a>
        <a href="login.html" class="button button-secondary">Login</a>
        <a href="recruiter.html" class="button button-outline">Recruiter</a>
        <a href="admin.html" class="button button-outline">Admin</a>
    </div>
</nav>

<div class="auth-page">
    <div class="auth-content">
        <div class="auth-card">
            <h1>Create Your Account</h1>
            <p>Join the platform to start improving your resume and tracking progress.</p>
            <input type="text" id="name" placeholder="Full Name">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button class="button button-primary" onclick="register()">Register</button>
            <div id="authFeedback" class="auth-feedback"></div>
            <p class="small-text">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>
</div>

<script src="auth.js"></script>

</body>
</html>
