<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AI Resume Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav-bar">
    <div class="nav-brand">
        <span class="brand-title">AI Resume Analyzer</span>
        <span class="brand-tag">Reset your password securely</span>
    </div>
    <div class="nav-actions">
        <a href="index.html" class="button button-outline">Home</a>
        <a href="login.html" class="button button-secondary">Login</a>
        <a href="register.html" class="button button-outline">Register</a>
    </div>
</nav>

<div class="auth-page">
    <div class="auth-content">
        <div class="auth-card">
            <h1>Forgot Password</h1>
            <p>Enter your registered email and a new password to reset your account.</p>
            <input type="email" id="email" placeholder="Registered Email">
            <input type="password" id="newPassword" placeholder="New Password">
            <button class="button button-primary" onclick="forgotPassword()">Reset Password</button>
            <div id="authFeedback" class="auth-feedback"></div>
            <p class="small-text">Remembered your password? <a href="login.html">Login</a></p>
        </div>
    </div>
</div>

<script src="auth.js"></script>

</body>
</html>
